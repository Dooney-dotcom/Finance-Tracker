name: Deploy API

on:
  push:
    branches: [main]
    paths: [api/**, .github/workflows/deploy-api.yml]
  workflow_dispatch:
  # Monthly rebuild so JRE and OS patches in the base image ship even when api/ doesn't change.
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: read
  id-token: write

env:
  IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/finance/finance-api:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: ./mvnw -q test
        working-directory: api
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
      - run: docker build -t "$IMAGE" api && docker push "$IMAGE"
      # Only the image changes; env vars, secret and service account stay as set on the service.
      - run: gcloud run deploy finance-api --image "$IMAGE" --region europe-west1 --project ${{ vars.GCP_PROJECT }}
