spring.application.name=api
# Local secrets live in api/.env (gitignored). In Cloud Run they come from env vars.
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# Supabase pooler, logged in as the least-privilege `finance_api` role.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Supabase Auth access tokens: ES256, verified against the project's public JWKS.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_URL}/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_URL}/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
spring.security.oauth2.resourceserver.jwt.audiences=authenticated

# Sessions idle longer than this are refused (enforced in the DB, see the session_idle_timeout migration).
app.session.idle-timeout=${SESSION_IDLE_TIMEOUT:30m}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CSV uploads are small statements.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
# JSON bodies: a full 5000-row import is ~1.7 MB (more with accented text). Refused while parsing, before the handler runs.
spring.jackson.factory.constraints.read.max-document-length=4194304
# No endpoint takes form bodies; don't parse them ahead of authentication.
spring.mvc.formcontent.filter.enabled=false
# Errors come back as RFC 9457 problem details; only our own messages are exposed.
spring.mvc.problemdetails.enabled=true
